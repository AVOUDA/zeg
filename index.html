<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVOUDA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --glow-rgb: 255, 255, 255;
            --glow-strength: 1;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #bg-vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 35%, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.85) 100%),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.25) 50%, rgba(0, 0, 0, 0.8) 100%);
        }

        #cursor-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 60;
            pointer-events: none;
        }

        #enter-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #enter-overlay.hidden-overlay {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .click-me-text {
            font-weight: 700;
            font-size: clamp(1.35rem, 2.5vw, 1.75rem);
            color: #ffffff;
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.45);
            transition: transform 0.2s ease, text-shadow 0.2s ease;
        }

        #enter-overlay:hover .click-me-text {
            transform: scale(1.04);
            text-shadow: 0 0 26px rgba(255, 255, 255, 0.8);
        }

        .name-glow {
            text-shadow:
                0 0 calc(16px * var(--glow-strength)) rgba(var(--glow-rgb), 0.55),
                0 0 calc(34px * var(--glow-strength)) rgba(var(--glow-rgb), 0.22);
        }

        .social-icon-glow {
            filter: drop-shadow(0 0 calc(8px * var(--glow-strength)) rgba(var(--glow-rgb), 0.55));
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .social-icon-glow:hover {
            transform: translateY(-3px) scale(1.1);
            filter: drop-shadow(0 0 calc(14px * var(--glow-strength)) rgba(var(--glow-rgb), 0.95));
        }

        .hud-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .cursor-blink {
            display: inline-block;
            margin-left: 2px;
            animation: blink 0.95s infinite;
        }
    </style>
</head>
<body>

    <div id="enter-overlay" role="button" tabindex="0" aria-label="Click to enter">
        <span class="click-me-text">Click me...</span>
    </div>

    <canvas id="bg-canvas"></canvas>
    <div id="bg-vignette"></div>
    <canvas id="cursor-canvas"></canvas>

    <div class="fixed top-4 left-4 z-30">
        <button id="audio-toggle-btn" type="button" title="Mute / Unmute" class="hud-pill h-10 w-10 rounded-xl flex items-center justify-center text-white/90 hover:text-white transition">
            <svg id="icon-sound-on" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                <path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z"/>
            </svg>
            <svg id="icon-sound-off" class="w-5 h-5 hidden text-white/50" viewBox="0 0 24 24" fill="currentColor">
                <path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM17.78 9.22a.75.75 0 1 0-1.06 1.06L18.44 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06l1.72-1.72 1.72 1.72a.75.75 0 1 0 1.06-1.06L20.56 12l1.72-1.72a.75.75 0 1 0-1.06-1.06l-1.72 1.72-1.72-1.72Z"/>
            </svg>
        </button>
    </div>

    <main class="relative z-10 w-full h-full flex flex-col items-center justify-center px-4 text-center pointer-events-none">
        <div class="pointer-events-auto flex flex-col items-center max-w-xl w-full">
            <h1 id="display-username" class="text-[38px] sm:text-[44px] font-bold tracking-tight text-white name-glow">
                AVOUDA
            </h1>

            <p class="mt-3 min-h-[24px] text-sm sm:text-base font-medium text-white/90">
                <span id="typewriter-text"></span><span class="cursor-blink">|</span>
            </p>

            <div id="socials-row" class="mt-6 flex items-center justify-center gap-4">
                <button id="discord-copy-btn" type="button" title="Copy Discord: avouda" class="social-icon-glow text-white focus:outline-none">
                    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <aside id="editor-drawer" class="fixed top-0 right-0 h-full w-80 z-40 bg-zinc-950/95 border-l border-white/10 backdrop-blur-xl translate-x-full transition-transform duration-300 p-5 flex flex-col justify-between text-xs">
        <div class="space-y-4">
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <span class="font-bold text-sm text-white">Quick Edit (Alt + P)</span>
                <button id="close-drawer-btn" type="button" class="text-white/60 hover:text-white">✕</button>
            </div>
            <div>
                <label class="block text-white/70 mb-1">Display Name</label>
                <input id="edit-name" type="text" class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/15 text-white focus:outline-none">
            </div>
            <div>
                <label class="block text-white/70 mb-1">Bio Lines (one per line)</label>
                <textarea id="edit-bio" rows="3" class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/15 text-white focus:outline-none"></textarea>
            </div>
            <div>
                <label class="block text-white/70 mb-1">Discord Handle</label>
                <input id="edit-discord" type="text" class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/15 text-white focus:outline-none">
            </div>
        </div>
        <button id="save-editor-btn" type="button" class="w-full py-2.5 rounded-lg bg-white text-black font-semibold hover:bg-white/90 transition">
            Save Locally
        </button>
    </aside>

    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-zinc-900 border border-white/15 text-xs text-white opacity-0 pointer-events-none transition-opacity duration-200">
        Copied: avouda
    </div>

    <script>
        (function () {
            const STORAGE_KEY = "clean_profile_v3";
            const defaults = {
                username: "AVOUDA",
                bioLines: [
                    "all those moments will be lost in time, like tears in rain.",
                    "more human than human."
                ],
                discord: "avouda"
            };

            let state = { ...defaults };
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
                if (saved) {
                    state.username = saved.username || defaults.username;
                    state.bioLines = Array.isArray(saved.bioLines) && saved.bioLines.length ? saved.bioLines : defaults.bioLines;
                    state.discord = typeof saved.discord === "string" ? saved.discord : defaults.discord;
                }
            } catch (_) {}

            const overlay = document.getElementById("enter-overlay");
            const usernameEl = document.getElementById("display-username");
            const typewriterEl = document.getElementById("typewriter-text");
            const discordBtn = document.getElementById("discord-copy-btn");
            const muteBtn = document.getElementById("audio-toggle-btn");
            const soundOnIcon = document.getElementById("icon-sound-on");
            const soundOffIcon = document.getElementById("icon-sound-off");
            const drawer = document.getElementById("editor-drawer");
            const closeDrawerBtn = document.getElementById("close-drawer-btn");
            const editNameInput = document.getElementById("edit-name");
            const editBioInput = document.getElementById("edit-bio");
            const editDiscordInput = document.getElementById("edit-discord");
            const saveEditorBtn = document.getElementById("save-editor-btn");
            const toastEl = document.getElementById("toast");

            function showToast(msg) {
                if (!toastEl) return;
                toastEl.textContent = msg;
                toastEl.style.opacity = "1";
                clearTimeout(showToast._t);
                showToast._t = setTimeout(() => { toastEl.style.opacity = "0"; }, 1800);
            }

            function renderProfile() {
                document.title = state.username;
                if (usernameEl) usernameEl.textContent = state.username;
            }

            let lineIdx = 0, charIdx = 0, deleting = false, typeTimer = null;
            function startTypewriter() {
                clearTimeout(typeTimer);
                const lines = state.bioLines.length ? state.bioLines : ["..."];
                const current = lines[lineIdx % lines.length];
                if (!deleting) {
                    charIdx++;
                    if (typewriterEl) typewriterEl.textContent = current.slice(0, charIdx);
                    if (charIdx >= current.length) {
                        deleting = true;
                        typeTimer = setTimeout(startTypewriter, 2000);
                        return;
                    }
                    typeTimer = setTimeout(startTypewriter, 55);
                } else {
                    charIdx--;
                    if (typewriterEl) typewriterEl.textContent = current.slice(0, Math.max(0, charIdx));
                    if (charIdx <= 0) {
                        deleting = false;
                        lineIdx = (lineIdx + 1) % lines.length;
                        typeTimer = setTimeout(startTypewriter, 350);
                        return;
                    }
                    typeTimer = setTimeout(startTypewriter, 30);
                }
            }

            let audioCtx = null, gainNode = null, isMuted = false;
            function initAudio() {
                if (audioCtx) return;
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                audioCtx = new Ctx();
                gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.04;
                gainNode.connect(audioCtx.destination);
                [110, 164.81, 220].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const subGain = audioCtx.createGain();
                    osc.type = i === 0 ? "triangle" : "sine";
                    osc.frequency.value = freq;
                    subGain.gain.value = i === 0 ? 0.45 : 0.2;
                    osc.connect(subGain);
                    subGain.connect(gainNode);
                    osc.start();
                });
            }

            if (muteBtn) {
                muteBtn.addEventListener("click", () => {
                    initAudio();
                    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
                    isMuted = !isMuted;
                    if (gainNode && audioCtx) gainNode.gain.setTargetAtTime(isMuted ? 0 : 0.04, audioCtx.currentTime, 0.08);
                    if (soundOnIcon) soundOnIcon.classList.toggle("hidden", isMuted);
                    if (soundOffIcon) soundOffIcon.classList.toggle("hidden", !isMuted);
                });
            }

            let entered = false;
            function enterSite() {
                if (entered) return;
                entered = true;
                if (overlay) overlay.classList.add("hidden-overlay");
                initAudio();
                if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
                startTypewriter();
            }

            if (overlay) {
                overlay.addEventListener("click", enterSite);
                overlay.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enterSite(); }
                });
            }

            if (discordBtn) {
                discordBtn.addEventListener("click", () => {
                    const handle = state.discord || defaults.discord;
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(handle).then(() => showToast(`Copied: ${handle}`)).catch(() => showToast(handle));
                    } else {
                        showToast(handle);
                    }
                });
            }

            function openDrawer() {
                if (!drawer) return;
                if (editNameInput) editNameInput.value = state.username;
                if (editBioInput) editBioInput.value = state.bioLines.join("\n");
                if (editDiscordInput) editDiscordInput.value = state.discord;
                drawer.classList.remove("translate-x-full");
            }
            function closeDrawer() { if (drawer) drawer.classList.add("translate-x-full"); }
            if (closeDrawerBtn) closeDrawerBtn.addEventListener("click", closeDrawer);

            if (saveEditorBtn) {
                saveEditorBtn.addEventListener("click", () => {
                    state.username = (editNameInput && editNameInput.value.trim()) || defaults.username;
                    const lines = editBioInput ? editBioInput.value.split("\n").map(s => s.trim()).filter(Boolean) : [];
                    state.bioLines = lines.length ? lines : defaults.bioLines;
                    state.discord = (editDiscordInput && editDiscordInput.value.trim()) || defaults.discord;
                    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
                    renderProfile();
                    lineIdx = 0; charIdx = 0; deleting = false;
                    startTypewriter();
                    closeDrawer();
                    showToast("Saved");
                });
            }

            document.addEventListener("keydown", (e) => {
                if (e.altKey && e.key && e.key.toLowerCase() === "p") {
                    e.preventDefault();
                    if (!drawer) return;
                    if (drawer.classList.contains("translate-x-full")) openDrawer();
                    else closeDrawer();
                }
            });

            const bgCanvas = document.getElementById("bg-canvas");
            const bgCtx = bgCanvas ? bgCanvas.getContext("2d") : null;
            const cursorCanvas = document.getElementById("cursor-canvas");
            const cursorCtx = cursorCanvas ? cursorCanvas.getContext("2d") : null;
            let drops = [], sparks = [];

            function resize() {
                const w = window.innerWidth, h = window.innerHeight;
                if (bgCanvas) { bgCanvas.width = w; bgCanvas.height = h; }
                if (cursorCanvas) { cursorCanvas.width = w; cursorCanvas.height = h; }
                drops = Array.from({ length: 120 }, () => ({
                    x: Math.random() * w, y: Math.random() * h,
                    len: 10 + Math.random() * 18, speed: 6 + Math.random() * 8
                }));
            }
            window.addEventListener("resize", resize);
            resize();

            window.addEventListener("mousemove", (e) => {
                for (let i = 0; i < 2; i++) {
                    sparks.push({
                        x: e.clientX + (Math.random() - 0.5) * 8,
                        y: e.clientY + (Math.random() - 0.5) * 8,
                        vy: 0.3 + Math.random() * 0.7, r: 1 + Math.random() * 1.4, alpha: 0.9
                    });
                }
            });

            function loop() {
                if (bgCtx && bgCanvas) {
                    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
                    bgCtx.strokeStyle = "rgba(255,255,255,0.16)";
                    bgCtx.lineWidth = 1;
                    drops.forEach(d => {
                        d.y += d.speed; d.x -= d.speed * 0.15;
                        if (d.y > bgCanvas.height) { d.y = -20; d.x = Math.random() * bgCanvas.width; }
                        bgCtx.beginPath();
                        bgCtx.moveTo(d.x, d.y);
                        bgCtx.lineTo(d.x + d.len * 0.15, d.y - d.len);
                        bgCtx.stroke();
                    });
                }
                if (cursorCtx && cursorCanvas) {
                    cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);
                    for (let i = sparks.length - 1; i >= 0; i--) {
                        const s = sparks[i];
                        s.y += s.vy; s.alpha -= 0.025;
                        if (s.alpha <= 0) { sparks.splice(i, 1); continue; }
                        cursorCtx.beginPath();
                        cursorCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        cursorCtx.fillStyle = `rgba(255,255,255,${s.alpha})`;
                        cursorCtx.fill();
                    }
                }
                requestAnimationFrame(loop);
            }

            renderProfile();
            loop();
        })();
    </script>
</body>
</html>
