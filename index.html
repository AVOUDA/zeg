<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVOUDA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --glow-rgb: 255, 255, 255;
            --glow-strength: 1.05;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        /* Full-bleed video zoomed slightly to push letterbox bars off-screen */
        #bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.24);
            transform-origin: center center;
            z-index: 0;
            opacity: 0;
            transition: opacity 1.1s ease;
            pointer-events: none;
        }

        #bg-video.active {
            opacity: 1;
        }

        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Clean, bright vignette with no horizontal lines */
        #bg-vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at 50% 35%, rgba(0, 0, 0, 0.02) 0%, rgba(0, 0, 0, 0.35) 100%);
        }

        #cursor-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 60;
            pointer-events: none;
        }

        #enter-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.75s ease;
        }

        #enter-overlay.hidden-overlay {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .click-me-text {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: clamp(1.35rem, 2.5vw, 1.75rem);
            letter-spacing: -0.01em;
            color: #ffffff;
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.45);
            transition: transform 0.25s ease, text-shadow 0.25s ease;
        }

        #enter-overlay:hover .click-me-text {
            transform: scale(1.03);
            text-shadow: 0 0 26px rgba(255, 255, 255, 0.8);
        }

        .name-glow {
            text-shadow:
                0 0 calc(16px * var(--glow-strength)) rgba(var(--glow-rgb), 0.65),
                0 0 calc(34px * var(--glow-strength)) rgba(var(--glow-rgb), 0.28);
        }

        .badge-glow {
            filter: drop-shadow(0 0 calc(7px * var(--glow-strength)) rgba(var(--glow-rgb), 0.65));
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), filter 0.2s ease;
        }

        .badge-glow:hover {
            transform: translateY(-2px) scale(1.12);
            filter: drop-shadow(0 0 calc(11px * var(--glow-strength)) rgba(var(--glow-rgb), 0.95));
        }

        .social-icon-glow {
            filter: drop-shadow(0 0 calc(8px * var(--glow-strength)) rgba(var(--glow-rgb), 0.65));
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), filter 0.22s ease, opacity 0.22s ease;
        }

        .social-icon-glow:hover {
            transform: translateY(-3px) scale(1.1);
            filter: drop-shadow(0 0 calc(14px * var(--glow-strength)) rgba(var(--glow-rgb), 0.95));
        }

        .uid-wrapper {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
        }

        .uid-pill {
            position: absolute;
            top: calc(100% + 6px);
            padding: 3px 10px;
            border-radius: 8px;
            background: rgba(18, 18, 22, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(-4px) scale(0.95);
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65);
        }

        .uid-wrapper:hover .uid-pill {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .badge-item {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .badge-item::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 7px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: rgba(16, 16, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #ffffff;
            font-size: 10px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.16s ease;
        }

        .badge-item:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .cursor-blink {
            display: inline-block;
            margin-left: 1px;
            font-weight: 400;
            animation: blink 0.95s infinite;
        }

        .hud-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .hud-pill:hover {
            background: rgba(255, 255, 255, 0.13);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .audio-pill-container .volume-wrap {
            width: 0;
            overflow: hidden;
            opacity: 0;
            transition: width 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease, margin-left 0.25s ease;
            margin-left: 0;
            display: flex;
            align-items: center;
        }

        .audio-pill-container:hover .volume-wrap,
        .audio-pill-container:focus-within .volume-wrap {
            width: 74px;
            opacity: 1;
            margin-left: 8px;
        }

        input[type="range"].hud-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"].hud-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 9999px;
        }
    </style>
</head>
<body>

    <div id="enter-overlay" role="button" tabindex="0" aria-label="Click to enter profile">
        <span class="click-me-text">Click me...</span>
    </div>

    <video id="bg-video" src="bg.mp4" autoplay loop muted playsinline preload="auto"></video>
    <canvas id="bg-canvas"></canvas>
    <div id="bg-vignette"></div>
    <canvas id="cursor-canvas"></canvas>

    <div class="fixed top-4 left-4 z-30">
        <div class="hud-pill audio-pill-container h-11 px-3 rounded-xl flex items-center">
            <button id="audio-toggle-btn" type="button" title="Mute / Unmute" class="text-white/90 hover:text-white flex items-center justify-center focus:outline-none">
                <svg id="icon-sound-on" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z"/>
                    <path d="M15.932 7.757a.75.75 0 0 1 1.061 0 6 6 0 0 1 0 8.486.75.75 0 0 1-1.06-1.061 4.5 4.5 0 0 0 0-6.364.75.75 0 0 1 0-1.06Z"/>
                </svg>
                <svg id="icon-sound-off" class="w-5 h-5 hidden text-white/60" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM17.78 9.22a.75.75 0 1 0-1.06 1.06L18.44 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06l1.72-1.72 1.72 1.72a.75.75 0 1 0 1.06-1.06L20.56 12l1.72-1.72a.75.75 0 1 0-1.06-1.06l-1.72 1.72-1.72-1.72Z"/>
                </svg>
            </button>
            <div class="volume-wrap">
                <input id="volume-slider" type="range" min="0" max="100" value="65" aria-label="Volume" class="hud-slider">
            </div>
        </div>
    </div>

    <div class="fixed top-4 right-4 z-30">
        <button id="open-customizer-btn" type="button" title="Customize Profile" class="hud-pill h-9 px-3 rounded-xl flex items-center gap-1.5 text-xs font-medium text-white/60 hover:text-white opacity-45 hover:opacity-100 transition duration-200">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            <span>Customize</span>
        </button>
    </div>

    <!-- Top-aligned floating profile block -->
    <main class="relative z-10 w-full h-full flex flex-col items-center justify-start pt-6 sm:pt-8 px-4 text-center pointer-events-none">
        <div class="pointer-events-auto flex flex-col items-center max-w-xl w-full">
            <div class="uid-wrapper cursor-default">
                <div id="display-uid" class="uid-pill">UID 1</div>
                <h1 id="display-username" class="text-[36px] sm:text-[42px] font-bold tracking-tight text-white leading-tight name-glow">
                    AVOUDA
                </h1>
            </div>

            <div id="badges-row" class="mt-2 flex items-center justify-center gap-2.5"></div>

            <div class="mt-3 min-h-[24px] flex items-center justify-center px-2">
                <p class="text-[14px] sm:text-[15px] font-semibold text-white/95 tracking-[-0.01em] drop-shadow-[0_2px_10px_rgba(0,0,0,0.85)]">
                    <span id="typewriter-text"></span><span class="cursor-blink text-white">|</span>
                </p>
            </div>

            <div id="socials-row" class="mt-4 flex items-center justify-center gap-4 flex-wrap"></div>
        </div>
    </main>

    <div class="fixed bottom-4 left-4 z-30">
        <div class="hud-pill h-9 px-3.5 rounded-xl flex items-center gap-2 text-xs font-semibold text-white/90">
            <svg class="w-4 h-4 text-white/85" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            <span id="view-count">28,011</span>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-zinc-950/90 border border-white/15 backdrop-blur-md text-xs font-medium text-white shadow-2xl opacity-0 pointer-events-none transition-all duration-300 translate-y-2">
        Copied to clipboard
    </div>

    <aside id="customizer-drawer" class="fixed top-0 right-0 h-full w-full sm:w-[370px] z-40 bg-[#09090b]/95 border-l border-white/10 backdrop-blur-2xl transform translate-x-full transition-transform duration-300 ease-out flex flex-col">
        <div class="px-5 py-4 border-b border-white/10 flex items-center justify-between">
            <div>
                <h2 class="text-sm font-bold text-white tracking-wide">Profile Studio</h2>
                <p class="text-[11px] text-white/45">Personalize visuals, media &amp; links</p>
            </div>
            <button id="close-customizer-btn" type="button" class="p-2 rounded-lg text-white/60 hover:text-white hover:bg-white/10 transition">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-5 text-xs">
            <div class="space-y-3">
                <h3 class="font-mono text-[10px] uppercase tracking-widest text-white/45">Identity</h3>
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-2">
                        <label class="block text-white/70 mb-1">Display Name</label>
                        <input id="input-username" type="text" class="w-full px-3 py-2 rounded-xl bg-white/[0.05] border border-white/10 text-white focus:outline-none focus:border-white/40">
                    </div>
                    <div>
                        <label class="block text-white/70 mb-1">UID</label>
                        <input id="input-uid" type="text" class="w-full px-3 py-2 rounded-xl bg-white/[0.05] border border-white/10 text-white focus:outline-none focus:border-white/40">
                    </div>
                </div>
                <div>
                    <label class="block text-white/70 mb-1">Typewriter Quotes (one per line)</label>
                    <textarea id="input-bio" rows="3" class="w-full px-3 py-2 rounded-xl bg-white/[0.05] border border-white/10 text-white focus:outline-none focus:border-white/40 leading-relaxed"></textarea>
                </div>
            </div>

            <div class="space-y-3 pt-3 border-t border-white/10">
                <h3 class="font-mono text-[10px] uppercase tracking-widest text-white/45">Background Video</h3>
                <div class="flex gap-2">
                    <label class="flex-1 py-2 px-3 rounded-xl bg-white/[0.07] hover:bg-white/[0.12] border border-white/10 text-center text-white/90 cursor-pointer transition font-medium">
                        <span>Preview Local Video</span>
                        <input id="input-video-file" type="file" accept="video/mp4,video/webm,video/*" class="hidden">
                    </label>
                    <button id="clear-video-btn" type="button" class="px-3 py-2 rounded-xl bg-white/[0.04] hover:bg-rose-500/20 border border-white/10 text-white/70 hover:text-rose-200 transition">
                        Use bg.mp4
                    </button>
                </div>
                <input id="input-video-url" type="text" class="mt-2 w-full px-3 py-2 rounded-xl bg-white/[0.05] border border-white/10 text-white focus:outline-none focus:border-white/40" placeholder="bg.mp4 or direct .mp4 URL...">
            </div>

            <div class="space-y-2.5 pt-3 border-t border-white/10">
                <h3 class="font-mono text-[10px] uppercase tracking-widest text-white/45">Badges, Glow &amp; Cursor</h3>
                <div class="grid grid-cols-2 gap-2" id="badge-toggles"></div>

                <div>
                    <label class="block text-white/70 mb-1.5">Neo-Noir Accent Glow</label>
                    <div class="grid grid-cols-2 gap-1.5" id="glow-preset-buttons">
                        <button type="button" data-glow-preset="white" class="glow-preset-btn px-2.5 py-1.5 rounded-xl bg-white/[0.06] border border-white/15 text-white flex items-center gap-2 hover:bg-white/[0.12] transition">
                            <span class="w-2.5 h-2.5 rounded-full bg-white"></span>
                            <span>Pure White</span>
                        </button>
                        <button type="button" data-glow-preset="cyan" class="glow-preset-btn px-2.5 py-1.5 rounded-xl bg-white/[0.06] border border-white/15 text-white flex items-center gap-2 hover:bg-white/[0.12] transition">
                            <span class="w-2.5 h-2.5 rounded-full bg-cyan-300"></span>
                            <span>2049 Cyan</span>
                        </button>
                        <button type="button" data-glow-preset="amber" class="glow-preset-btn px-2.5 py-1.5 rounded-xl bg-white/[0.06] border border-white/15 text-white flex items-center gap-2 hover:bg-white/[0.12] transition">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                            <span>Spinner Amber</span>
                        </button>
                        <button type="button" data-glow-preset="magenta" class="glow-preset-btn px-2.5 py-1.5 rounded-xl bg-white/[0.06] border border-white/15 text-white flex items-center gap-2 hover:bg-white/[0.12] transition">
                            <span class="w-2.5 h-2.5 rounded-full bg-fuchsia-400"></span>
                            <span>Joi Magenta</span>
                        </button>
                    </div>
                </div>

                <label class="flex items-center justify-between pt-2 cursor-pointer">
                    <span class="text-white/80">Sparkle Cursor Dust Trail</span>
                    <input id="input-cursor-trail" type="checkbox" class="accent-white w-4 h-4 rounded">
                </label>

                <div>
                    <div class="flex justify-between text-white/70 mb-1">
                        <span>Glow Intensity</span>
                        <span id="val-glow">105%</span>
                    </div>
                    <input id="input-glow" type="range" min="0" max="160" value="105" class="w-full accent-white">
                </div>
            </div>

            <div class="space-y-2 pt-3 border-t border-white/10">
                <h3 class="font-mono text-[10px] uppercase tracking-widest text-white/45">Social Icon (Discord)</h3>
                <input id="input-discord" type="text" class="w-full px-3 py-2 rounded-xl bg-white/[0.05] border border-white/10 text-white" placeholder="Discord Handle (e.g. avouda)">
            </div>
        </div>

        <div class="p-4 border-t border-white/10 bg-black/60 flex items-center gap-2">
            <button id="save-btn" type="button" class="flex-1 py-2.5 rounded-xl bg-white text-black font-semibold text-xs hover:bg-white/90 transition">
                Save Changes
            </button>
            <button id="reset-btn" type="button" class="px-3.5 py-2.5 rounded-xl bg-white/5 hover:bg-rose-500/20 border border-white/10 text-white/70 hover:text-rose-200 text-xs transition">
                Reset
            </button>
        </div>
    </aside>

    <script>
        (function () {
            const STORAGE_KEY = "avouda_bladerunner_v6";
            const DEFAULT_VIDEO = "bg.mp4";
            const GLOW_PRESETS = {
                white:   { rgb: "255, 255, 255" },
                cyan:    { rgb: "103, 232, 249" },
                amber:   { rgb: "251, 191, 36"  },
                magenta: { rgb: "232, 121, 249" }
            };

            const DEFAULT_CONFIG = {
                username: "AVOUDA",
                uid: "1",
                bioLines: [
                    "all those moments will be lost in time, like tears in rain.",
                    "within cells interlinked.",
                    "a system of cells interlinked within cells interlinked.",
                    "more human than human."
                ],
                glowPreset: "white",
                videoUrl: DEFAULT_VIDEO,
                glowStrength: 105,
                cursorTrail: true,
                badges: {
                    verified: true,
                    developer: true,
                    supporter: true,
                    nexus: true
                },

                    discord: "avouda"
                },
                views: 28011
            };

            const BADGE_DEFS = {
                verified: {
                    label: "Verified",
                    svg: `<svg class="w-[18px] h-[18px] text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L14.4 4.1L17.5 3.6L18.6 6.5L21.4 8L20.8 11.1L22.5 13.8L20.4 16.1L20.6 19.2L17.6 20.1L15.9 22.8L12.9 21.9L10.1 23.4L7.9 21.2L4.8 21.3L4.1 18.2L1.5 16.5L2.6 13.6L1.3 10.8L3.7 8.8L3.9 5.7L7 5.2L9 2.7L12 2ZM10.4 15.8L17.1 9.1L15.7 7.7L10.4 13L8.2 10.8L6.8 12.2L10.4 15.8Z"/></svg>`
                },
                developer: {
                    label: "Developer",
                    svg: `<svg class="w-[18px] h-[18px] text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>`
                },
                supporter: {
                    label: "Early Supporter",
                    svg: `<svg class="w-[17px] h-[17px] text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`
                },
                nexus: {
                    label: "Nexus-9",
                    svg: `<svg class="w-[18px] h-[18px] text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 9l10 13L22 9 12 2zm0 3.1L18.4 9 12 17.4 5.6 9 12 5.1z"/></svg>`
                }
            };

            const DISCORD_SVG = `<svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>`;

            function normalizeVideoUrl(url) {
                const trimmed = (url || "").trim();
                // Blob URLs expire on reload, so always fall back to bg.mp4
                if (!trimmed || trimmed.startsWith("blob:")) return DEFAULT_VIDEO;
                return trimmed;
            }

            function loadConfig() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        return {
                            ...DEFAULT_CONFIG,
                            ...parsed,
                            videoUrl: normalizeVideoUrl(parsed.videoUrl),
                            badges: { ...DEFAULT_CONFIG.badges, ...(parsed.badges || {}) },
                            socials: { ...DEFAULT_CONFIG.socials, ...(parsed.socials || {}) }
                        };
                    }
                } catch (_) {}
                return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
            }

            let config = loadConfig();

            function saveConfig() {
                try {
                    const toStore = {
                        ...config,
                        videoUrl: normalizeVideoUrl(config.videoUrl)
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(toStore));
                } catch (_) {}
            }

            const overlay = document.getElementById("enter-overlay");
            const bgVideo = document.getElementById("bg-video");
            const usernameEl = document.getElementById("display-username");
            const uidEl = document.getElementById("display-uid");
            const badgesRow = document.getElementById("badges-row");
            const socialsRow = document.getElementById("socials-row");
            const viewCountEl = document.getElementById("view-count");
            const typewriterEl = document.getElementById("typewriter-text");
            const muteBtn = document.getElementById("audio-toggle-btn");
            const soundOnIcon = document.getElementById("icon-sound-on");
            const soundOffIcon = document.getElementById("icon-sound-off");
            const volumeSlider = document.getElementById("volume-slider");
            const drawer = document.getElementById("customizer-drawer");
            const openBtn = document.getElementById("open-customizer-btn");
            const closeBtn = document.getElementById("close-customizer-btn");
            const saveBtn = document.getElementById("save-btn");
            const resetBtn = document.getElementById("reset-btn");
            const toastEl = document.getElementById("toast");

            function showToast(msg) {
                if (!toastEl) return;
                toastEl.textContent = msg;
                toastEl.classList.remove("opacity-0", "translate-y-2");
                toastEl.classList.add("opacity-100", "translate-y-0");
                clearTimeout(showToast._t);
                showToast._t = setTimeout(() => {
                    toastEl.classList.remove("opacity-100", "translate-y-0");
                    toastEl.classList.add("opacity-0", "translate-y-2");
                }, 1900);
            }

            function applyVideoSource(forceSrc) {
                if (!bgVideo) return;
                const rawSrc = forceSrc || normalizeVideoUrl(config.videoUrl);
                const targetSrc = rawSrc.startsWith("blob:") || rawSrc.startsWith("http") ? rawSrc : encodeURI(rawSrc);
                if (bgVideo.getAttribute("src") !== targetSrc) {
                    bgVideo.setAttribute("src", targetSrc);
                    bgVideo.load();
                }
                bgVideo.play().catch(() => {});
            }

            if (bgVideo) {
                bgVideo.addEventListener("canplay", () => {
                    bgVideo.classList.add("active");
                    bgVideo.play().catch(() => {});
                });
                bgVideo.addEventListener("error", () => {
                    // If a custom URL fails, fall back to bg.mp4
                    if (bgVideo.getAttribute("src") !== DEFAULT_VIDEO) {
                        config.videoUrl = DEFAULT_VIDEO;
                        saveConfig();
                        bgVideo.setAttribute("src", DEFAULT_VIDEO);
                        bgVideo.load();
                    } else {
                        bgVideo.classList.remove("active");
                    }
                });
            }

            function renderAll() {
                document.title = config.username || "AVOUDA";
                if (usernameEl) usernameEl.textContent = config.username || "AVOUDA";
                if (uidEl) uidEl.textContent = `UID ${config.uid || "1"}`;
                if (viewCountEl) viewCountEl.textContent = Number(config.views || 0).toLocaleString();

                const preset = GLOW_PRESETS[config.glowPreset] || GLOW_PRESETS.white;
                document.documentElement.style.setProperty("--glow-rgb", preset.rgb);
                document.documentElement.style.setProperty("--glow-strength", String((config.glowStrength ?? 105) / 100));

                if (badgesRow) {
                    badgesRow.innerHTML = "";
                    Object.keys(BADGE_DEFS).forEach((key) => {
                        if (!config.badges[key]) return;
                        const span = document.createElement("span");
                        span.className = "badge-item badge-glow";
                        span.setAttribute("data-tooltip", BADGE_DEFS[key].label);
                        span.innerHTML = BADGE_DEFS[key].svg;
                        badgesRow.appendChild(span);
                    });
                }

                if (socialsRow) {
                    socialsRow.innerHTML = "";
                    const handle = (config.socials && config.socials.discord) || "avouda";
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.title = `Copy Discord: ${handle}`;
                    btn.className = "social-icon-glow focus:outline-none";
                    btn.innerHTML = DISCORD_SVG;
                    btn.addEventListener("click", () => {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(handle).then(() => showToast(`Copied Discord: ${handle}`)).catch(() => showToast(`Discord: ${handle}`));
                        } else {
                            showToast(`Discord: ${handle}`);
                        }
                    });
                    socialsRow.appendChild(btn);
                }

                applyVideoSource();
            }

            let lineIdx = 0, charIdx = 0, deleting = false, typeTimer = null;
            function startTypewriter() {
                clearTimeout(typeTimer);
                const lines = Array.isArray(config.bioLines) && config.bioLines.length ? config.bioLines : DEFAULT_CONFIG.bioLines;
                const current = lines[lineIdx % lines.length];
                if (!deleting) {
                    charIdx++;
                    if (typewriterEl) typewriterEl.textContent = current.slice(0, charIdx);
                    if (charIdx >= current.length) {
                        deleting = true;
                        typeTimer = setTimeout(startTypewriter, 2000);
                        return;
                    }
                    typeTimer = setTimeout(startTypewriter, 52);
                } else {
                    charIdx--;
                    if (typewriterEl) typewriterEl.textContent = current.slice(0, Math.max(0, charIdx));
                    if (charIdx <= 0) {
                        deleting = false;
                        lineIdx = (lineIdx + 1) % lines.length;
                        typeTimer = setTimeout(startTypewriter, 350);
                        return;
                    }
                    typeTimer = setTimeout(startTypewriter, 28);
                }
            }

            let isMuted = true;
            function syncAudioUI() {
                if (soundOnIcon) soundOnIcon.classList.toggle("hidden", isMuted);
                if (soundOffIcon) soundOffIcon.classList.toggle("hidden", !isMuted);
                if (bgVideo) {
                    bgVideo.muted = isMuted;
                    const vol = volumeSlider ? Number(volumeSlider.value) / 100 : 0.65;
                    bgVideo.volume = Math.max(0, Math.min(1, vol));
                }
            }
            syncAudioUI();

            if (muteBtn) {
                muteBtn.addEventListener("click", () => {
                    isMuted = !isMuted;
                    syncAudioUI();
                    if (bgVideo) bgVideo.play().catch(() => {});
                });
            }

            if (volumeSlider) {
                volumeSlider.addEventListener("input", () => {
                    if (bgVideo) bgVideo.volume = Math.max(0, Math.min(1, Number(volumeSlider.value) / 100));
                });
            }

            let entered = false;
            function enterSite() {
                if (entered) return;
                entered = true;
                if (overlay) overlay.classList.add("hidden-overlay");
                config.views = Number(config.views || 0) + 1;
                if (viewCountEl) viewCountEl.textContent = Number(config.views).toLocaleString();
                saveConfig();
                if (bgVideo) {
                    bgVideo.play().catch(() => {});
                }
                startTypewriter();
            }

            if (overlay) {
                overlay.addEventListener("click", enterSite);
                overlay.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enterSite(); }
                });
            }

            const inputUsername = document.getElementById("input-username");
            const inputUid = document.getElementById("input-uid");
            const inputBio = document.getElementById("input-bio");
            const inputVideoFile = document.getElementById("input-video-file");
            const clearVideoBtn = document.getElementById("clear-video-btn");
            const inputVideoUrl = document.getElementById("input-video-url");
            const badgeToggles = document.getElementById("badge-toggles");
            const inputCursorTrail = document.getElementById("input-cursor-trail");
            const inputGlow = document.getElementById("input-glow");
            const valGlow = document.getElementById("val-glow");
            const inputDiscord = document.getElementById("input-discord");

            function populateDrawer() {
                if (inputUsername) inputUsername.value = config.username || "";
                if (inputUid) inputUid.value = config.uid || "1";
                if (inputBio) inputBio.value = (config.bioLines || []).join("\n");
                if (inputVideoUrl) inputVideoUrl.value = normalizeVideoUrl(config.videoUrl);
                if (inputCursorTrail) inputCursorTrail.checked = config.cursorTrail !== false;
                if (inputGlow) inputGlow.value = String(config.glowStrength ?? 105);
                if (valGlow) valGlow.textContent = `${config.glowStrength ?? 105}%`;
                if (inputDiscord) inputDiscord.value = (config.socials && config.socials.discord) || "";

                if (badgeToggles) {
                    badgeToggles.innerHTML = "";
                    Object.keys(BADGE_DEFS).forEach((key) => {
                        const label = document.createElement("label");
                        label.className = "flex items-center justify-between px-2.5 py-1.5 rounded-xl bg-white/[0.04] border border-white/10 cursor-pointer";
                        label.innerHTML = `<span class="text-white/85">${BADGE_DEFS[key].label}</span><input type="checkbox" data-badge="${key}" class="accent-white w-3.5 h-3.5" ${config.badges[key] ? "checked" : ""}>`;
                        badgeToggles.appendChild(label);
                    });
                }
            }

            if (openBtn && drawer) {
                openBtn.addEventListener("click", () => {
                    populateDrawer();
                    drawer.classList.remove("translate-x-full");
                });
            }
            if (closeBtn && drawer) {
                closeBtn.addEventListener("click", () => drawer.classList.add("translate-x-full"));
            }

            document.querySelectorAll(".glow-preset-btn").forEach((b) => {
                b.addEventListener("click", () => {
                    const p = b.getAttribute("data-glow-preset");
                    if (p && GLOW_PRESETS[p]) {
                        config.glowPreset = p;
                        renderAll();
                    }
                });
            });

            if (inputGlow && valGlow) {
                inputGlow.addEventListener("input", () => {
                    valGlow.textContent = `${inputGlow.value}%`;
                });
            }

            if (inputVideoFile) {
                inputVideoFile.addEventListener("change", (e) => {
                    const file = e.target.files && e.target.files[0];
                    if (!file) return;
                    const blobUrl = URL.createObjectURL(file);
                    if (bgVideo) {
                        bgVideo.setAttribute("src", blobUrl);
                        bgVideo.load();
                        bgVideo.classList.add("active");
                        bgVideo.play().catch(() => {});
                    }
                    showToast("Previewing local file (reverts to bg.mp4 on reload)");
                });
            }

            if (clearVideoBtn) {
                clearVideoBtn.addEventListener("click", () => {
                    if (inputVideoUrl) inputVideoUrl.value = DEFAULT_VIDEO;
                    if (inputVideoFile) inputVideoFile.value = "";
                    config.videoUrl = DEFAULT_VIDEO;
                    saveConfig();
                    applyVideoSource(DEFAULT_VIDEO);
                    showToast("Using bg.mp4");
                });
            }

            if (saveBtn) {
                saveBtn.addEventListener("click", () => {
                    config.username = (inputUsername && inputUsername.value.trim()) || DEFAULT_CONFIG.username;
                    config.uid = (inputUid && inputUid.value.trim()) || DEFAULT_CONFIG.uid;
                    const lines = inputBio ? inputBio.value.split("\n").map((s) => s.trim()).filter(Boolean) : [];
                    config.bioLines = lines.length ? lines : DEFAULT_CONFIG.bioLines;
                    config.videoUrl = normalizeVideoUrl(inputVideoUrl ? inputVideoUrl.value : DEFAULT_VIDEO);
                    config.cursorTrail = inputCursorTrail ? inputCursorTrail.checked : true;
                    config.glowStrength = inputGlow ? Number(inputGlow.value) : 105;
                    if (!config.socials) config.socials = {};
                    config.socials.discord = (inputDiscord && inputDiscord.value.trim()) || "avouda";
                    if (badgeToggles) {
                        badgeToggles.querySelectorAll("input[type='checkbox'][data-badge]").forEach((cb) => {
                            config.badges[cb.getAttribute("data-badge")] = cb.checked;
                        });
                    }
                    saveConfig();
                    renderAll();
                    lineIdx = 0; charIdx = 0; deleting = false;
                    startTypewriter();
                    if (drawer) drawer.classList.add("translate-x-full");
                    showToast("Changes saved");
                });
            }

            if (resetBtn) {
                resetBtn.addEventListener("click", () => {
                    try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
                    config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
                    renderAll();
                    populateDrawer();
                    showToast("Reset to default");
                });
            }

            const bgCanvas = document.getElementById("bg-canvas");
            const bgCtx = bgCanvas ? bgCanvas.getContext("2d") : null;
            const cursorCanvas = document.getElementById("cursor-canvas");
            const cursorCtx = cursorCanvas ? cursorCanvas.getContext("2d") : null;
            let drops = [], sparks = [];

            function resize() {
                const w = window.innerWidth, h = window.innerHeight;
                if (bgCanvas) { bgCanvas.width = w; bgCanvas.height = h; }
                if (cursorCanvas) { cursorCanvas.width = w; cursorCanvas.height = h; }
                drops = Array.from({ length: 120 }, () => ({
                    x: Math.random() * w, y: Math.random() * h,
                    len: 10 + Math.random() * 18, speed: 6 + Math.random() * 8
                }));
            }
            window.addEventListener("resize", resize);
            resize();

            window.addEventListener("mousemove", (e) => {
                if (config.cursorTrail === false) return;
                for (let i = 0; i < 2; i++) {
                    sparks.push({
                        x: e.clientX + (Math.random() - 0.5) * 8,
                        y: e.clientY + (Math.random() - 0.5) * 8,
                        vy: 0.3 + Math.random() * 0.7, r: 1 + Math.random() * 1.4, alpha: 0.9
                    });
                }
            });

            function loop() {
                if (bgCtx && bgCanvas) {
                    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
                    bgCtx.strokeStyle = "rgba(255,255,255,0.12)";
                    bgCtx.lineWidth = 1;
                    drops.forEach((d) => {
                        d.y += d.speed; d.x -= d.speed * 0.15;
                        if (d.y > bgCanvas.height) { d.y = -20; d.x = Math.random() * bgCanvas.width; }
                        bgCtx.beginPath();
                        bgCtx.moveTo(d.x, d.y);
                        bgCtx.lineTo(d.x + d.len * 0.15, d.y - d.len);
                        bgCtx.stroke();
                    });
                }
                if (cursorCtx && cursorCanvas) {
                    cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);
                    for (let i = sparks.length - 1; i >= 0; i--) {
                        const s = sparks[i];
                        s.y += s.vy; s.alpha -= 0.025;
                        if (s.alpha <= 0) { sparks.splice(i, 1); continue; }
                        cursorCtx.beginPath();
                        cursorCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        cursorCtx.fillStyle = `rgba(255,255,255,${s.alpha})`;
                        cursorCtx.fill();
                    }
                }
                requestAnimationFrame(loop);
            }

            renderAll();
            loop();
        })();
    </script>
</body>
</html>
