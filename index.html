<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVOUDA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --glow-rgb: 255, 255, 255;
            --glow-strength: 1;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        /* Full-screen Background Video & Canvas Layers */
        #bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0;
            transition: opacity 1.1s ease;
            pointer-events: none;
        }

        #bg-video.active {
            opacity: 1;
        }

        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Atmospheric Dark Vignette Overlay so crisp white text always stands out */
        #bg-vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 35%, rgba(0, 0, 0, 0.22) 0%, rgba(0, 0, 0, 0.82) 100%),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.48) 0%, rgba(0, 0, 0, 0.22) 45%, rgba(0, 0, 0, 0.78) 100%),
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 1px, transparent 1px, transparent 3px);
        }

        /* Sparkling Stardust Cursor Trail Canvas (Always on top, non-blocking) */
        #cursor-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 60;
            pointer-events: none;
        }

        /* Pure Black Click-to-Enter Overlay */
        #enter-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.75s ease;
        }

        #enter-overlay.hidden-overlay {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .click-me-text {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: clamp(1.35rem, 2.5vw, 1.75rem);
            letter-spacing: -0.01em;
            color: #ffffff;
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.45);
            transition: transform 0.25s ease, text-shadow 0.25s ease;
        }

        #enter-overlay:hover .click-me-text {
            transform: scale(1.03);
            text-shadow: 0 0 26px rgba(255, 255, 255, 0.8);
        }

        /* Floating Typography Glows (No Card Box!) */
        .name-glow {
            text-shadow:
                0 0 calc(16px * var(--glow-strength)) rgba(var(--glow-rgb), 0.55),
                0 0 calc(34px * var(--glow-strength)) rgba(var(--glow-rgb), 0.22);
        }

        .badge-glow {
            filter: drop-shadow(0 0 calc(7px * var(--glow-strength)) rgba(var(--glow-rgb), 0.65));
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), filter 0.2s ease;
        }

        .badge-glow:hover {
            transform: translateY(-2px) scale(1.12);
            filter: drop-shadow(0 0 calc(11px * var(--glow-strength)) rgba(var(--glow-rgb), 0.95));
        }

        .social-icon-glow {
            filter: drop-shadow(0 0 calc(8px * var(--glow-strength)) rgba(var(--glow-rgb), 0.55));
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), filter 0.22s ease, opacity 0.22s ease;
        }

        .social-icon-glow:hover {
            transform: translateY(-3px) scale(1.1);
            filter: drop-shadow(0 0 calc(14px * var(--glow-strength)) rgba(var(--glow-rgb), 0.95));
        }

        /* UID Pill Tooltip on Name Hover */
        .uid-wrapper {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
        }

        .uid-pill {
            position: absolute;
            bottom: calc(100% + 6px);
            padding: 3px 10px;
            border-radius: 8px;
            background: rgba(18, 18, 22, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(5px) scale(0.95);
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65);
        }

        .uid-wrapper:hover .uid-pill {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Individual Badge Hover Tooltip */
        .badge-item {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .badge-item::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 7px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: rgba(16, 16, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #ffffff;
            font-size: 10px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.16s ease;
        }

        .badge-item:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Blinking Typewriter Cursor */
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .cursor-blink {
            display: inline-block;
            margin-left: 1px;
            font-weight: 400;
            animation: blink 0.95s infinite;
        }

        /* Corner HUD Glass Pills (Top-Left Audio & Bottom-Left Views) */
        .hud-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .hud-pill:hover {
            background: rgba(255, 255, 255, 0.13);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Expandable Volume Slider inside Top-Left Audio Pill */
        .audio-pill-container .volume-wrap {
            width: 0;
            overflow: hidden;
            opacity: 0;
            transition: width 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease, margin-left 0.25s ease;
            margin-left: 0;
            display: flex;
            align-items: center;
        }

        .audio-pill-container:hover .volume-wrap,
        .audio-pill-container:focus-within .volume-wrap {
            width: 74px;
            opacity: 1;
            margin-left: 8px;
        }

        input[type="range"].hud-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"].hud-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }

        /* Custom Scrollbar for Studio Drawer */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 9999px;
        }
    </style>
</head>
<body>

    <!-- 1. CLICK-TO-ENTER PURE BLACK OVERLAY -->
    <div id="enter-overlay" role="button" tabindex="0" aria-label="Click to enter profile">
        <span class="click-me-text">Click me...</span>
    </div>

    <!-- 2. FULL-SCREEN BACKGROUND MEDIA LAYERS -->
    <video id="bg-video" loop muted playsinline></video>
    <canvas id="bg-canvas"></canvas>
    <div id="bg-vignette"></div>

    <!-- 3. SPARKLING STARDUST CURSOR TRAIL CANVAS -->
    <canvas id="cursor-canvas"></canvas>

    <!-- Hidden Custom Audio Player (for uploaded .mp3/.wav) -->
    <audio id="custom-audio" loop preload="auto"></audio>

    <!-- 4. TOP-LEFT AUDIO CONTROL PILL (Exact match to video) -->
    <div class="fixed top-4 left-4 z-30">
        <div class="hud-pill audio-pill-container h-11 px-3 rounded-xl flex items-center">
            <button id="audio-toggle-btn" title="Mute / Unmute" class="text-white/90 hover:text-white flex items-center justify-center focus:outline-none">
                <!-- Speaker Unmuted Icon -->
                <svg id="icon-sound-on" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z"/>
                    <path d="M15.932 7.757a.75.75 0 0 1 1.061 0 6 6 0 0 1 0 8.486.75.75 0 0 1-1.06-1.061 4.5 4.5 0 0 0 0-6.364.75.75 0 0 1 0-1.06Z"/>
                </svg>
                <!-- Speaker Muted Icon -->
                <svg id="icon-sound-off" class="w-5 h-5 hidden text-white/60" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM17.78 9.22a.75.75 0 1 0-1.06 1.06L18.44 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06l1.72-1.72 1.72 1.72a.75.75 0 1 0 1.06-1.06L20.56 12l1.72-1.72a.75.75 0 1 0-1.06-1.06l-1.72 1.72-1.72-1.72Z"/>
                </svg>
            </button>
            <div class="volume-wrap">
                <input id="volume-slider" type="range" min="0" max="100" value="65" aria-label="Volume" class="hud-slider">
            </div>
        </div>
    </div>

    <!-- 5. TOP-RIGHT SUBTLE CUSTOMIZE BUTTON -->
    <div class="fixed top-4 right-4 z-30">
        <button id="open-customizer-btn" title="Customize Profile" class="hud-pill h-9 px-3 rounded-xl flex items-center gap-1.5 text-xs font-medium text-white/60 hover:text-white opacity-45 hover:opacity-100 transition duration-200">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            <span>Customize</span>
        </button>
    </div>

    <!-- 6. MAIN CENTERED FLOATING PROFILE (NO BOXED CARD, NO COUNTRY) -->
    <main class="relative z-10 w-full h-full flex flex-col items-center pt-[14vh] sm:pt-[15vh] px-4 text-center pointer-events-none">
        <div class="pointer-events-auto flex flex-col items-center max-w-xl w-full">

            <!-- Name + Hover UID Pill -->
            <div class="uid-wrapper cursor-default">
                <div id="display-uid" class="uid-pill">UID 1</div>
                <h1 id="display-username" class="text-[36px] sm:text-[42px] font-bold tracking-tight text-white leading-tight name-glow">
                    Abdullah
                </h1>
            </div>

            <!-- 4 Glowing White Badges Row -->
            <div id="badges-row" class="mt-2 flex items-center justify-center gap-2.5">
                <!-- Injected dynamically via JS -->
            </div>

            <!-- Multi-Phrase Typewriter Bio -->
            <div class="mt-4 min-h-[26px] flex items-center justify-center px-2">
                <p class="text-[14px] sm:text-[15px] font-semibold text-white/95 tracking-[-0.01em] drop-shadow-[0_2px_10px_rgba(0,0,0,0.85)]">
                    <span id="typewriter-text"></span><span class="cursor-blink text-white">|</span>
                </p>
            </div>

            <!-- NO COUNTRY / LOCATION ROW (Strictly omitted as requested) -->

            <!-- Monochrome Glowing White Social Icons Row -->
            <div id="socials-row" class="mt-5 flex items-center justify-center gap-4 flex-wrap">
                <!-- Injected dynamically via JS -->
            </div>

        </div>
    </main>

    <!-- 7. BOTTOM-LEFT VIEW COUNTER PILL (Exact match to video) -->
    <div class="fixed bottom-4 left-4 z-30">
        <div class="hud-pill h-9 px-3.5 rounded-xl flex items-center gap-2 text-xs font-semibold text-white/90">
            <svg class="w-4 h-4 text-white/85" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            <span id="view-count">105</span>
        </div>
    </div>

    <!-- 8. TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-zinc-950/90 border border-white/15 backdrop-blur-md text-xs font-medium text-white shadow-2xl opacity-0 pointer-events-none transition-all duration-300 translate-y-2">
        Copied to clipboard
    </div>

    <!-- 9. SLIDE-OVER PROFILE STUDIO DRAWER -->
    <aside id="customizer-drawer" class="fixed top-0 right-0 h-full w-full sm:w-[370px] z-40 bg-[#09090b]/95 border-l border-white/10 backdrop-blur-2xl transform translate-x-full transition-transform duration-300 ease-out flex flex-col">
        <!-- Drawer Header -->
        <div class="px-5 py-4 border-b border-white/10 flex items-center justify-between">
            <div>
                <h2 class="text-sm font-bold text-white tracking-wide">Profile Studio</h2>
                <p class="text-[11px] text-white/45">Personalize visuals, media &amp; links</p>
            </div>
            <button id="close-customizer-btn" class="p-2 rounded-lg text-white/60 hover:text-white hover:bg-white/10 transition">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Drawer Scrollable Body -->
        <div class="flex-1 overflow-y-auto p-5 space-y-5 text-xs">

            <!-- Identity -->
            <div class="space-y-3">
                <h3 class="font-mono text-[10px] uppercase tracking-widest text-white/45">Identity (No Location)</h3>
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-2">
                        <label class="block text-white/70 mb-1">Display Name</label>
                        <input id="input-username" type="text" class="w-full px-3 py-2 rounded-xl bg-white/[0.05] border border-white/10 text-white focus:outline-none focus:border-white/40" placeholder="Abdullah">
                    </div>
                    <div>
                        <label class="block text-white/70 mb-1">UID</label>
                        <input id="input-uid" type="text" class="w-full px-3 py-2 rounded-xl bg-white/[0.05] border border-white/10 text-white focus:outline-none focus:border-white/40" placeholder="1">
                    </div>
                </div>

                <div>
                    <label class="block text-white/70 mb-1">Typewriter Quotes (one per line)</label>
                    <textarea id="input-bio" rows="3" class="w-full px-3 py-2 rounded-xl bg-white/[0.05] border border-white/10 text-white focus:outline-none focus:border-white/40 leading-relaxed" placeholder="all those moments will be lost in time, like tears in rain."></textarea>
                </div>
            </div>

            <!-- Background Video & Atmosphere -->
            <div class="space-y-3 pt-3 border-t border-white/10">
                <h3 class="font-mono text-[10px] uppercase tracking-widest text-white/45">Blade Runner Scene &amp; Video</h3>

                <div>
                    <label class="block text-white/70 mb-1">Built-in Neo-Noir Atmosphere</label>
                    <select id="input-bg-mode" class="w-full px-3 py-2 rounded-xl bg-[#111115] border border-white/10 text-white focus:outline-none focus:border-white/40">
                        <option value="2049montage">Blade Runner 2049 Edit Montage</option>
                        <option value="2049rain">2049 Rain &amp; Neon Haze</option>
                        <option value="tearsinrain">Tears in Rain (Monochrome Noir)</option>
                        <option value="embers">Off-World Amber &amp; Silver Embers</option>
                        <option value="grid">Hologram Perspective Grid</option>
                    </select>
                </div>

                <div>
                    <label class="block text-white/70 mb-1">Upload Blade Runner Video (.mp4 / .webm)</label>
                    <div class="flex gap-2">
                        <label class="flex-1 py-2 px-3 rounded-xl bg-white/[0.07] hover:bg-white/[0.12] border border-white/10 text-center text-white/90 cursor-pointer transition font-medium">
                            <span>Upload Video File</span>
                            <input id="input-video-file" type="file" accept="video/mp4,video/webm,video/*" class="hidden">
                        </label>
                        <button id="clear-video-btn" class="px-3 py-2 rounded-xl bg-white/[0.04] hover:bg-rose-500/20 border border-white/10 text-white/70 hover:text-rose-200 transition">
                            Clear
                        </button>
                    </div>
                    <input id="input-video-url" type="text" class="mt-2 w-full px-3 py-2 rounded-xl bg-white/[0.05] border border-white/10 text-white focus:outline-none focus:border-white/40" placeholder="Or paste direct .mp4 video URL...">
                </div>
            </div>

            <!-- Background Audio -->
            <div class="space-y-2.5 pt-3 border-t border-white/10">
                <h3 class="font-mono text-[10px] uppercase tracking-widest text-white/45">Soundtrack &amp; Synth</h3>
                <div>
                    <label class="block text-white/70 mb-1">Built-in Synth Preset</label>
                    <select id="input-synth-preset" class="w-full px-3 py-2 rounded-xl bg-[#111115] border border-white/10 text-white focus:outline-none focus:border-white/40">
                        <option value="nightcall">Nightcall Synth (Dark Outrun Pulse)</option>
                        <option value="tears">Tears in Rain Synth (CS-80 Pad)</option>
                        <option value="seawall">2049 Seawall Drone (Deep Sub Bass)</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <label class="flex-1 py-2 px-3 rounded-xl bg-white/[0.07] hover:bg-white/[0.12] border border-white/10 text-center text-white/90 cursor-pointer transition font-medium">
                        <span>Upload Song (.mp3 / .wav)</span>
                        <input id="input-audio-file" type="file" accept="audio/*" class="hidden">
                    </label>
                    <button id="clear-audio-btn" class="px-3 py-2 rounded-xl bg-white/[0.04] hover:bg-rose-500/20 border border-white/10 text-white/70 hover:text-rose-200 transition">
                        Synth
                    </button>
                </div>
                <p id="audio-source-label" class="text-[11px] text-white/45">Active: Tears in Rain Synth (CS-80 Pad)</p>
            </div>

            <!-- Badges & Cursor Sparkles -->
            <div class="space-y-2.5 pt-3 border-t border-white/10">
                <h3 class="font-mono text-[10px] uppercase tracking-widest text-white/45">Badges, Glow &amp; Cursor</h3>
                <div class="grid grid-cols-2 gap-2" id="badge-toggles"></div>

                <div>
                    <label class="block text-white/70 mb-1.5">Neo-Noir Accent Glow</label>
                    <div class="grid grid-cols-2 gap-1.5" id="glow-preset-buttons">
                        <button type="button" data-glow-preset="white" class="glow-preset-btn px-2.5 py-1.5 rounded-xl bg-white/[0.06] border border-white/15 text-white flex items-center gap-2 hover:bg-white/[0.12] transition">
                            <span class="w-2.5 h-2.5 rounded-full bg-white shadow-[0_0_8px_#fff]"></span>
                            <span>Pure White</span>
                        </button>
                        <button type="button" data-glow-preset="cyan" class="glow-preset-btn px-2.5 py-1.5 rounded-xl bg-white/[0.06] border border-white/15 text-white flex items-center gap-2 hover:bg-white/[0.12] transition">
                            <span class="w-2.5 h-2.5 rounded-full bg-cyan-300 shadow-[0_0_8px_#67e8f9]"></span>
                            <span>2049 Cyan</span>
                        </button>
                        <button type="button" data-glow-preset="amber" class="glow-preset-btn px-2.5 py-1.5 rounded-xl bg-white/[0.06] border border-white/15 text-white flex items-center gap-2 hover:bg-white/[0.12] transition">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_8px_#fbbf24]"></span>
                            <span>Spinner Amber</span>
                        </button>
                        <button type="button" data-glow-preset="magenta" class="glow-preset-btn px-2.5 py-1.5 rounded-xl bg-white/[0.06] border border-white/15 text-white flex items-center gap-2 hover:bg-white/[0.12] transition">
                            <span class="w-2.5 h-2.5 rounded-full bg-fuchsia-400 shadow-[0_0_8px_#e879f9]"></span>
                            <span>Joi Magenta</span>
                        </button>
                    </div>
                </div>

                <label class="flex items-center justify-between pt-2 cursor-pointer">
                    <span class="text-white/80">Sparkle Cursor Dust Trail</span>
                    <input id="input-cursor-trail" type="checkbox" class="accent-white w-4 h-4 rounded">
                </label>

                <div>
                    <div class="flex justify-between text-white/70 mb-1">
                        <span>Glow Intensity</span>
                        <span id="val-glow">100%</span>
                    </div>

        /**
         * 1. SPARKLING STARDUST CURSOR TRAIL (Exact match to video's mouse trail)
         */
        const cursorCanvas = document.getElementById("cursor-canvas");
        const cursorCtx = cursorCanvas.getContext("2d");
        let sparkles = [];
        let lastMouse = { x: null, y: null };

        function resizeCanvases() {
            cursorCanvas.width = window.innerWidth;
            cursorCanvas.height = window.innerHeight;
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            initBgParticles();
        }

        function spawnSparkles(x, y, count = 4) {
            if (!config.cursorTrail) return;
            for (let i = 0; i < count; i++) {
                sparkles.push({
                    x: x + (Math.random() - 0.5) * 6,
                    y: y + (Math.random() - 0.5) * 6,
                    vx: (Math.random() - 0.5) * 0.55,
                    vy: 0.25 + Math.random() * 0.85,
                    size: 0.7 + Math.random() * 1.4,
                    alpha: 0.75 + Math.random() * 0.25,
                    decay: 0.014 + Math.random() * 0.015,
                    twinkle: Math.random() * Math.PI * 2
                });
            }
            if (sparkles.length > 420) {
                sparkles.splice(0, sparkles.length - 420);
            }
        }

        function handlePointerMove(x, y) {
            if (lastMouse.x !== null) {
                const dx = x - lastMouse.x;
                const dy = y - lastMouse.y;
                const dist = Math.hypot(dx, dy);
                const steps = Math.min(12, Math.max(1, Math.floor(dist / 4)));
                for (let s = 0; s < steps; s++) {
                    const t = s / steps;
                    spawnSparkles(lastMouse.x + dx * t, lastMouse.y + dy * t, 2);
                }
            } else {
                spawnSparkles(x, y, 4);
            }
            lastMouse = { x, y };
        }

        window.addEventListener("mousemove", (e) => handlePointerMove(e.clientX, e.clientY));
        window.addEventListener("touchmove", (e) => {
            if (e.touches && e.touches[0]) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        function renderCursorSparkles() {
            cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);

            for (let i = sparkles.length - 1; i >= 0; i--) {
                const p = sparkles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.012; // subtle gravity drift
                p.alpha -= p.decay;
                p.twinkle += 0.25;

                if (p.alpha <= 0) {
                    sparkles.splice(i, 1);
                    continue;
                }

                const flicker = 0.65 + 0.35 * Math.sin(p.twinkle);
                const finalAlpha = Math.max(0, p.alpha * flicker);
                const preset = GLOW_PRESETS[config.glowPreset] || GLOW_PRESETS.white;

                cursorCtx.beginPath();
                cursorCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                cursorCtx.fillStyle = `rgba(255, 255, 255, ${finalAlpha})`;
                cursorCtx.shadowBlur = 7;
                cursorCtx.shadowColor = `rgba(${preset.rgb}, 0.9)`;
                cursorCtx.fill();
            }
            cursorCtx.shadowBlur = 0;
            requestAnimationFrame(renderCursorSparkles);
        }

        /**
         * 2. BLADE RUNNER 2049 PROCEDURAL NEO-NOIR BACKGROUND SCENES
         */
        const bgCanvas = document.getElementById("bg-canvas");
        const bgCtx = bgCanvas.getContext("2d");
        let bgParticles = [];
        let bgRain = [];
        let bgTime = 0;

        function initBgParticles() {
            bgParticles = [];
            bgRain = [];
            const mode = config.bgMode;

            if (mode === "2049rain" || mode === "tearsinrain" || mode === "2049montage") {
                const rainCount = Math.min(260, Math.floor((bgCanvas.width * bgCanvas.height) / 6800));
                for (let i = 0; i < rainCount; i++) {
                    bgRain.push({
                        x: Math.random() * (bgCanvas.width + 200) - 100,
                        y: Math.random() * bgCanvas.height,
                        len: 12 + Math.random() * 24,
                        speed: 9 + Math.random() * 11,
                        alpha: 0.08 + Math.random() * 0.24,
                        width: Math.random() > 0.82 ? 1.3 : 0.75
                    });
                }
                for (let i = 0; i < 24; i++) {
                    bgParticles.push({
                        x: Math.random() * bgCanvas.width,
                        y: Math.random() * bgCanvas.height,
                        r: mode === "2049montage" ? (2 + Math.random() * 4.5) : (160 + Math.random() * 260),
                        vx: mode === "2049montage" ? ((Math.random() - 0.5) * 0.8) : ((Math.random() - 0.5) * 0.3),
                        vy: mode === "2049montage" ? (0.8 + Math.random() * 1.9) : ((Math.random() - 0.5) * 0.18),
                        alpha: mode === "2049montage" ? (0.25 + Math.random() * 0.55) : (0.03 + Math.random() * 0.04),
                        phase: Math.random() * Math.PI * 2
                    });
                }
            } else if (mode === "embers") {
                for (let i = 0; i < 95; i++) {
                    bgParticles.push({
                        x: Math.random() * bgCanvas.width,
                        y: Math.random() * bgCanvas.height,
                        r: 0.8 + Math.random() * 2.1,
                        vx: (Math.random() - 0.5) * 0.45,
                        vy: -(0.25 + Math.random() * 0.65),
                        alpha: 0.2 + Math.random() * 0.55,
                        isAmber: Math.random() > 0.42,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }
        }

        function renderBgScene() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgTime += 0.012;

            const videoEl = document.getElementById("bg-video");
            const hasVideo = videoEl.classList.contains("active");

            if (!hasVideo) {
                const w = bgCanvas.width;
                const h = bgCanvas.height;

                if (config.bgMode === "2049montage") {
                    // Cycles smoothly through the 2049 edit moods from your video:
                    // 0: Snowfall & cold slate | 1: Neon cyan/magenta skyline & street | 2: Las Vegas amber desert | 3: Spinner lights & rain
                    const cycleDuration = 4.6; // seconds per sequence
                    const totalElapsed = bgTime / 0.012;
                    const seqFloat = (totalElapsed / (cycleDuration * 60)) % 4;
                    const seqIndex = Math.floor(seqFloat);
                    const seqProgress = seqFloat - seqIndex;
                    const flashPulse = Math.pow(Math.sin(bgTime * 3.4) * 0.5 + 0.5, 6);

                    if (seqIndex === 0) {
                        // Snowfall over cold concrete steps (K opening scene)
                        const g = bgCtx.createLinearGradient(0, 0, 0, h);
                        g.addColorStop(0, "#1c2833");
                        g.addColorStop(0.65, "#2a3944");
                        g.addColorStop(1, "#0b1014");
                        bgCtx.fillStyle = g;
                        bgCtx.fillRect(0, 0, w, h);

                        // Subtle snow steps silhouette at bottom
                        bgCtx.fillStyle = "rgba(215, 228, 236, 0.08)";
                        for (let s = 0; s < 5; s++) {
                            const sy = h * (0.62 + s * 0.075);
                            bgCtx.fillRect(w * 0.18, sy, w * 0.68, 6);
                        }

                        // Falling snow flakes
                        bgParticles.forEach(p => {
                            p.x += p.vx + Math.sin(bgTime * 2 + p.phase) * 0.6;
                            p.y += p.vy;
                            if (p.y > h + 10) { p.y = -10; p.x = Math.random() * w; }
                            if (p.x < -10) p.x = w + 10;
                            if (p.x > w + 10) p.x = -10;
                            bgCtx.beginPath();
                            bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                            bgCtx.fillStyle = `rgba(224, 242, 254, ${p.alpha})`;
                            bgCtx.fill();
                        });
                    } else if (seqIndex === 1) {
                        // Neon skyline, street stalls & Joi hologram glow
                        const g = bgCtx.createLinearGradient(0, 0, w, h);
                        g.addColorStop(0, "#051018");
                        g.addColorStop(0.5, "#081c24");
                        g.addColorStop(1, "#160916");
                        bgCtx.fillStyle = g;
                        bgCtx.fillRect(0, 0, w, h);

                        // Neon sign glow blobs (Cyan, Hot Pink/Red, Amber)
                        const neon1 = bgCtx.createRadialGradient(w * 0.25, h * 0.35, 10, w * 0.25, h * 0.35, w * 0.35);
                        neon1.addColorStop(0, "rgba(34, 211, 238, 0.22)");
                        neon1.addColorStop(1, "rgba(0,0,0,0)");
                        bgCtx.fillStyle = neon1;
                        bgCtx.fillRect(0, 0, w, h);

                        const neon2 = bgCtx.createRadialGradient(w * 0.72, h * 0.32, 10, w * 0.72, h * 0.32, w * 0.32);
                        neon2.addColorStop(0, "rgba(244, 63, 94, 0.20)");
                        neon2.addColorStop(1, "rgba(0,0,0,0)");
                        bgCtx.fillStyle = neon2;
                        bgCtx.fillRect(0, 0, w, h);

                        // Tower blocks silhouette
                        bgCtx.fillStyle = "rgba(3, 7, 11, 0.72)";
                        [0.08, 0.22, 0.38, 0.56, 0.74, 0.88].forEach((bx, idx) => {
                            const bw = w * 0.11;
                            const bh = h * (0.28 + ((idx * 17) % 35) * 0.01);
                            bgCtx.fillRect(w * bx - bw / 2, h - bh, bw, bh);
                        });
                    } else if (seqIndex === 2) {
                        // Las Vegas 2049 amber desert & spinner silhouette
                        const g = bgCtx.createLinearGradient(0, 0, 0, h);
                        g.addColorStop(0, "#5c2404");
                        g.addColorStop(0.5, "#b45309");
                        g.addColorStop(1, "#291003");
                        bgCtx.fillStyle = g;
                        bgCtx.fillRect(0, 0, w, h);

                        // Sand dune wave
                        bgCtx.beginPath();
                        bgCtx.moveTo(0, h * 0.68);
                        bgCtx.quadraticCurveTo(w * 0.45, h * (0.56 + Math.sin(seqProgress * Math.PI) * 0.04), w, h * 0.72);
                        bgCtx.lineTo(w, h);
                        bgCtx.lineTo(0, h);
                        bgCtx.closePath();
                        bgCtx.fillStyle = "rgba(45, 17, 2, 0.55)";
                        bgCtx.fill();
                    } else {
                        // Night spinners, beams & heavy rain
                        const g = bgCtx.createLinearGradient(0, 0, 0, h);
                        g.addColorStop(0, "#04080d");
                        g.addColorStop(0.55, "#0a1722");
                        g.addColorStop(1, "#05070a");
                        bgCtx.fillStyle = g;
                        bgCtx.fillRect(0, 0, w, h);

                        // Light beam sweep
                        const beamX = w * (0.25 + seqProgress * 0.5);
                        const beam = bgCtx.createRadialGradient(beamX, h * 0.35, 5, beamX, h * 0.35, w * 0.35);
                        beam.addColorStop(0, "rgba(125, 211, 252, 0.2)");
                        beam.addColorStop(1, "rgba(0,0,0,0)");
                        bgCtx.fillStyle = beam;
                        bgCtx.fillRect(0, 0, w, h);
                    }

                    // Rain streaks across montage + subtle synth bass pulse
                    bgCtx.lineCap = "round";
                    bgRain.forEach(r => {
                        r.x -= r.speed * 0.16;
                        r.y += r.speed;
                        if (r.y > h + 30) {
                            r.y = -30;
                            r.x = Math.random() * (w + 200) - 50;
                        }
                        bgCtx.strokeStyle = `rgba(255, 255, 255, ${r.alpha * 0.75})`;
                        bgCtx.lineWidth = r.width;
                        bgCtx.beginPath();
                        bgCtx.moveTo(r.x, r.y);
                        bgCtx.lineTo(r.x + r.len * 0.16, r.y - r.len);
                        bgCtx.stroke();
                    });

                    // Subtle beat pulse vignette
                    if (flashPulse > 0.02) {
                        bgCtx.fillStyle = `rgba(255, 255, 255, ${flashPulse * 0.035})`;
                        bgCtx.fillRect(0, 0, w, h);
                    }
                } else if (config.bgMode === "2049rain") {
                    // Atmospheric Blade Runner 2049 smog + diagonal rain
                    const g = bgCtx.createLinearGradient(0, 0, w, h);
                    g.addColorStop(0, "#050b10");
                    g.addColorStop(0.55, "#091822");
                    g.addColorStop(1, "#05070a");
                    bgCtx.fillStyle = g;
                    bgCtx.fillRect(0, 0, w, h);

                    bgParticles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < -p.r) p.x = w + p.r;
                        if (p.x > w + p.r) p.x = -p.r;
                        if (p.y < -p.r) p.y = h + p.r;
                        if (p.y > h + p.r) p.y = -p.r;

                        const haze = bgCtx.createRadialGradient(p.x, p.y, 10, p.x, p.y, p.r);
                        haze.addColorStop(0, `rgba(125, 211, 252, ${p.alpha})`);
                        haze.addColorStop(1, "rgba(0, 0, 0, 0)");
                        bgCtx.fillStyle = haze;
                        bgCtx.fillRect(0, 0, w, h);
                    });

                    bgCtx.lineCap = "round";
                    bgRain.forEach(r => {
                        r.x -= r.speed * 0.18;
                        r.y += r.speed;
                        if (r.y > h + 30) {
                            r.y = -30;
                            r.x = Math.random() * (w + 200) - 50;
                        }
                        bgCtx.strokeStyle = `rgba(224, 242, 254, ${r.alpha})`;
                        bgCtx.lineWidth = r.width;
                        bgCtx.beginPath();
                        bgCtx.moveTo(r.x, r.y);
                        bgCtx.lineTo(r.x + r.len * 0.18, r.y - r.len);
                        bgCtx.stroke();
                    });
                } else if (config.bgMode === "tearsinrain") {
                    // Monochrome noir rain
                    bgCtx.fillStyle = "#040507";
                    bgCtx.fillRect(0, 0, w, h);

                    bgCtx.lineCap = "round";
                    bgRain.forEach(r => {
                        r.x -= r.speed * 0.14;
                        r.y += r.speed * 0.92;
                        if (r.y > h + 30) {
                            r.y = -30;
                            r.x = Math.random() * (w + 200) - 50;
                        }
                        bgCtx.strokeStyle = `rgba(255, 255, 255, ${r.alpha * 0.85})`;
                        bgCtx.lineWidth = r.width;
                        bgCtx.beginPath();
                        bgCtx.moveTo(r.x, r.y);
                        bgCtx.lineTo(r.x + r.len * 0.14, r.y - r.len);
                        bgCtx.stroke();
                    });
                } else if (config.bgMode === "embers") {
                    // Off-world amber & silver floating embers
                    const g = bgCtx.createLinearGradient(0, 0, 0, h);
                    g.addColorStop(0, "#050507");
                    g.addColorStop(1, "#160d06");
                    bgCtx.fillStyle = g;
                    bgCtx.fillRect(0, 0, w, h);

                    bgParticles.forEach(p => {
                        p.x += p.vx + Math.sin(bgTime * 1.5 + p.phase) * 0.25;
                        p.y += p.vy;
                        p.phase += 0.04;
                        if (p.y < -15) {
                            p.y = h + 15;
                            p.x = Math.random() * w;
                        }
                        const pulse = 0.65 + 0.35 * Math.sin(p.phase);
                        bgCtx.beginPath();
                        bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        bgCtx.fillStyle = p.isAmber
                            ? `rgba(251, 191, 36, ${p.alpha * pulse})`
                            : `rgba(255, 255, 255, ${p.alpha * pulse})`;
                        bgCtx.fill();
                    });
                } else if (config.bgMode === "grid") {
                    // Hologram perspective grid
                    bgCtx.fillStyle = "#040609";
                    bgCtx.fillRect(0, 0, w, h);

                    const horizon = h * 0.54;
                    const vanishX = w * 0.5;
                    bgCtx.strokeStyle = "rgba(255, 255, 255, 0.08)";
                    bgCtx.lineWidth = 1;

                    // Converging vertical lines
                    for (let i = -14; i <= 14; i++) {
                        bgCtx.beginPath();
                        bgCtx.moveTo(vanishX + i * 24, horizon);
                        bgCtx.lineTo(vanishX + i * 110, h);
                        bgCtx.stroke();
                    }

                    // Scrolling horizontal grid lines
                    const offset = (bgTime * 28) % 36;
                    for (let y = horizon; y < h; y += 14 + (y - horizon) * 0.12) {
                        const yy = y + offset * ((y - horizon) / (h - horizon));
                        if (yy > h) continue;
                        bgCtx.beginPath();
                        bgCtx.moveTo(0, yy);
                        bgCtx.lineTo(w, yy);
                        bgCtx.stroke();
                    }
                }
            }

            requestAnimationFrame(renderBgScene);
        }

        /**
         * 3. VANGELIS / 2049-INSPIRED WEB AUDIO SYNTHESIZER + CUSTOM MP3 SUPPORT
         */
        class SoundController {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.isPlaying = false;
                this.isMuted = false;
                this.volume = 0.65;
                this.intervalId = null;
                this.step = 0;
                this.useCustomFile = false;
                this.customAudio = document.getElementById("custom-audio");
                this.presets = {
                    nightcall: {
                        name: "Nightcall Synth (Dark Outrun Pulse)",
                        tempoMs: 3600,
                        mode: "nightcall",
                        chords: [
                            [110.00, 164.81, 220.00, 261.63, 329.63], // Am9
                            [87.31,  130.81, 174.61, 220.00, 261.63], // Fmaj7
                            [65.41,  130.81, 196.00, 246.94, 329.63], // Cmaj7
                            [82.41,  123.47, 164.81, 196.00, 246.94]  // Em7
                        ],
                        bassNotes: [55.00, 43.65, 65.41, 41.20]
                    },
                    tears: {
                        name: "Tears in Rain Synth (CS-80 Pad)",
                        tempoMs: 4200,
                        mode: "pad",
                        chords: [
                            [110.00, 164.81, 220.00, 261.63, 329.63], // Am(add9)
                            [87.31,  130.81, 174.61, 220.00, 329.63], // Fmaj7(#11)
                            [65.41,  130.81, 196.00, 246.94, 293.66], // Cmaj9
                            [82.41,  123.47, 164.81, 207.65, 246.94]  // E7sus/E
                        ]
                    },
                    seawall: {
                        name: "2049 Seawall Drone (Deep Sub Bass)",
                        tempoMs: 4800,
                        mode: "seawall",
                        chords: [
                            [55.00, 110.00, 130.81, 164.81], // Deep A1 Sub + Am
                            [43.65, 87.31,  130.81, 164.81], // Deep F1 Sub + Fmaj7
                            [49.00, 98.00,  146.83, 174.61], // Deep G1 Sub + G6
                            [41.20, 82.41,  123.47, 164.81]  // Deep E1 Sub + Em
                        ]
                    }
                };
            }

            initSynth() {
                if (this.ctx) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0;
                this.masterGain.connect(this.ctx.destination);
            }

            triggerNightcallBar(presetData, barIndex) {
                if (!this.ctx || !this.isPlaying || this.useCustomFile) return;
                const now = this.ctx.currentTime;
                const barDuration = presetData.tempoMs / 1000;
                const freqs = presetData.chords[barIndex % presetData.chords.length];
                const rootBass = presetData.bassNotes[barIndex % presetData.bassNotes.length];

                // 1. Lush minor synthwave pad behind the arpeggio
                freqs.forEach((f, idx) => {
                    const osc = this.ctx.createOscillator();
                    const filter = this.ctx.createBiquadFilter();
                    const env = this.ctx.createGain();

                    osc.type = idx % 2 === 0 ? "sawtooth" : "triangle";
                    osc.frequency.setValueAtTime(f, now);

                    filter.type = "lowpass";
                    filter.frequency.setValueAtTime(680, now);
                    filter.frequency.exponentialRampToValueAtTime(1150, now + barDuration * 0.6);
                    filter.frequency.exponentialRampToValueAtTime(520, now + barDuration);

                    env.gain.setValueAtTime(0.0001, now);
                    env.gain.linearRampToValueAtTime(0.022, now + 0.6);
                    env.gain.exponentialRampToValueAtTime(0.0001, now + barDuration);

                    osc.connect(filter);
                    filter.connect(env);
                    env.connect(this.masterGain);

                    osc.start(now);
                    osc.stop(now + barDuration + 0.05);
                });

                // 2. Signature driving 8th-note Nightcall synth bass pulse (16 steps across the bar)
                const steps = 16;
                const stepDur = barDuration / steps;
                for (let s = 0; s < steps; s++) {
                    const t = now + s * stepDur;
                    const isOctaveUp = s % 4 === 2;
                    const noteFreq = isOctaveUp ? rootBass * 2 : rootBass;

                    const bassOsc = this.ctx.createOscillator();
                    const bassFilter = this.ctx.createBiquadFilter();
                    const bassEnv = this.ctx.createGain();

                    bassOsc.type = "sawtooth";
                    bassOsc.frequency.setValueAtTime(noteFreq, t);

                    bassFilter.type = "lowpass";
                    bassFilter.Q.setValueAtTime(4.5, t);
                    bassFilter.frequency.setValueAtTime(s % 2 === 0 ? 520 : 340, t);
                    bassFilter.frequency.exponentialRampToValueAtTime(110, t + stepDur * 0.85);

                    const accent = (s % 2 === 0) ? 0.065 : 0.04;
                    bassEnv.gain.setValueAtTime(0.0001, t);
                    bassEnv.gain.linearRampToValueAtTime(accent, t + 0.012);
                    bassEnv.gain.exponentialRampToValueAtTime(0.0001, t + stepDur * 0.9);

                    bassOsc.connect(bassFilter);
                    bassFilter.connect(bassEnv);
                    bassEnv.connect(this.masterGain);

                    bassOsc.start(t);
                    bassOsc.stop(t + stepDur);
                }

                // 3. Subtle retro 80s kick on beats 0, 4, 8, 12 and snare on beats 4, 12
                [0, 4, 8, 12].forEach((beatStep) => {
                    const kt = now + beatStep * stepDur;
                    const kickOsc = this.ctx.createOscillator();
                    const kickGain = this.ctx.createGain();
                    kickOsc.type = "sine";
                    kickOsc.frequency.setValueAtTime(125, kt);
                    kickOsc.frequency.exponentialRampToValueAtTime(38, kt + 0.14);

                    kickGain.gain.setValueAtTime(0.14, kt);
                    kickGain.gain.exponentialRampToValueAtTime(0.0001, kt + 0.18);

                    kickOsc.connect(kickGain);
                    kickGain.connect(this.masterGain);
                    kickOsc.start(kt);
                    kickOsc.stop(kt + 0.2);

                    if (beatStep === 4 || beatStep === 12) {
                        const bufferSize = Math.floor(this.ctx.sampleRate * 0.14);
                        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                        const data = noiseBuffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            data[i] = Math.random() * 2 - 1;
                        }
                        const noise = this.ctx.createBufferSource();
                        noise.buffer = noiseBuffer;

                        const hp = this.ctx.createBiquadFilter();
                        hp.type = "bandpass";
                        hp.frequency.setValueAtTime(1600, kt);

                        const snareGain = this.ctx.createGain();
                        snareGain.gain.setValueAtTime(0.045, kt);
                        snareGain.gain.exponentialRampToValueAtTime(0.0001, kt + 0.13);

                        noise.connect(hp);
                        hp.connect(snareGain);
                        snareGain.connect(this.masterGain);
                        noise.start(kt);
                    }
                });
            }

            playChord(freqs, isSeawall) {
                if (!this.ctx || !this.isPlaying || this.useCustomFile) return;
                const now = this.ctx.currentTime;
                const duration = isSeawall ? 5.4 : 4.8;

                freqs.forEach((f, idx) => {
                    const osc = this.ctx.createOscillator();
                    const oscDetune = this.ctx.createOscillator();
                    const filter = this.ctx.createBiquadFilter();
                    const env = this.ctx.createGain();

                    // Warm analog CS-80 style dual-detuned saw/triangle oscillators
                    osc.type = isSeawall && idx === 0 ? "sawtooth" : "triangle";
                    oscDetune.type = "sine";
                    osc.frequency.setValueAtTime(f, now);
                    oscDetune.frequency.setValueAtTime(f * 1.0035, now);

                    filter.type = "lowpass";
                    filter.Q.setValueAtTime(isSeawall ? 3.2 : 1.8, now);
                    filter.frequency.setValueAtTime(isSeawall ? 190 : 280, now);
                    filter.frequency.exponentialRampToValueAtTime(isSeawall ? 420 : 760, now + duration * 0.45);
                    filter.frequency.exponentialRampToValueAtTime(210, now + duration);

                    const peakGain = (isSeawall && idx === 0 ? 0.085 : 0.06) / freqs.length;
                    env.gain.setValueAtTime(0.0001, now);
                    env.gain.linearRampToValueAtTime(peakGain, now + 1.4);
                    env.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                    osc.connect(filter);
                    oscDetune.connect(filter);
                    filter.connect(env);
                    env.connect(this.masterGain);

                    osc.start(now);
                    oscDetune.start(now);
                    osc.stop(now + duration + 0.1);
                    oscDetune.stop(now + duration + 0.1);
                });
            }

            start() {
                this.isPlaying = true;
                this.isMuted = false;

                if (this.useCustomFile) {
                    this.customAudio.volume = this.volume;
                    this.customAudio.muted = false;
                    this.customAudio.play().catch(() => {});
                } else {
                    this.initSynth();
                    if (this.ctx.state === "suspended") this.ctx.resume();
                    const now = this.ctx.currentTime;
                    this.masterGain.gain.cancelScheduledValues(now);
                    this.masterGain.gain.setTargetAtTime(this.volume, now, 0.35);

                    this.restartSynthLoop();
                }
                this.updateIcons();
            }

            restartSynthLoop() {
                if (this.intervalId) {
                    clearInterval(this.intervalId);
                    this.intervalId = null;
                }
                if (this.useCustomFile || !this.isPlaying) return;

                const runPresetStep = () => {
                    const preset = this.presets[config.synthPreset] || this.presets.nightcall;
                    const idx = this.step++;
                    if (preset.mode === "nightcall") {
                        this.triggerNightcallBar(preset, idx);
                    } else {
                        this.playChord(preset.chords[idx % preset.chords.length], preset.mode === "seawall");
                    }
                };

                const initialPreset = this.presets[config.synthPreset] || this.presets.nightcall;
                runPresetStep();
                this.intervalId = setInterval(() => {
                    if (this.isPlaying && !this.isMuted && !this.useCustomFile) {
                        runPresetStep();
                    }
                }, initialPreset.tempoMs);
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                if (this.useCustomFile) {
                    this.customAudio.muted = this.isMuted;
                    if (!this.isMuted && this.customAudio.paused) {
                        this.customAudio.play().catch(() => {});
                    }
                } else {
                    this.initSynth();
                    if (this.ctx.state === "suspended") this.ctx.resume();
                    const now = this.ctx.currentTime;
                    this.masterGain.gain.cancelScheduledValues(now);
                    this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : this.volume, now, 0.12);
                    if (!this.isMuted && !this.intervalId) {
                        this.start();
                    }
                }
                this.updateIcons();
            }

            setVolume(val) {
                this.volume = Math.max(0, Math.min(1, val));
                if (this.volume > 0 && this.isMuted) {
                    this.isMuted = false;
                }
                if (this.useCustomFile) {
                    this.customAudio.volume = this.volume;
                    this.customAudio.muted = this.isMuted;
                } else if (this.ctx && this.masterGain) {
                    const now = this.ctx.currentTime;
                    this.masterGain.gain.cancelScheduledValues(now);
                    this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : this.volume, now, 0.08);
                }
                this.updateIcons();
            }

            setCustomAudioSrc(url, name) {
                if (this.ctx && this.masterGain) {
                    this.masterGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
                }
                this.useCustomFile = true;
                this.customAudio.src = url;
                this.customAudio.volume = this.volume;
                this.customAudio.muted = this.isMuted;
                if (this.isPlaying && !this.isMuted) {
                    this.customAudio.play().catch(() => {});
                }
                document.getElementById("audio-source-label").textContent = `Active: ${name}`;
            }

            resetToSynth() {
                this.customAudio.pause();
                this.customAudio.removeAttribute("src");
                this.useCustomFile = false;
                const preset = this.presets[config.synthPreset] || this.presets.tears;
                document.getElementById("audio-source-label").textContent = `Active: ${preset.name}`;
                if (this.isPlaying && !this.isMuted) {
                    this.start();
                }
            }

            updateIcons() {
                const muted = this.isMuted || this.volume === 0;
                document.getElementById("icon-sound-on").classList.toggle("hidden", muted);
                document.getElementById("icon-sound-off").classList.toggle("hidden", !muted);
            }
        }

        /**
         * 4. MULTI-PHRASE TYPEWRITER ENGINE (Exact match to video's typing & deleting quotes)
         */
        let typeLineIdx = 0;
        let typeCharIdx = 0;
        let isDeleting = false;
        let typeTimer = null;

        function tickTypewriter() {
            clearTimeout(typeTimer);
            const lines = config.bioLines.length ? config.bioLines : ["..."];
            const current = lines[typeLineIdx % lines.length];
            const el = document.getElementById("typewriter-text");

            if (!isDeleting) {
                typeCharIdx++;
                el.textContent = current.slice(0, typeCharIdx);
                if (typeCharIdx >= current.length) {
                    isDeleting = true;
                    typeTimer = setTimeout(tickTypewriter, 2400);
                    return;
                }
                typeTimer = setTimeout(tickTypewriter, 52 + Math.random() * 35);
            } else {
                typeCharIdx--;
                el.textContent = current.slice(0, Math.max(0, typeCharIdx));
                if (typeCharIdx <= 0) {
                    isDeleting = false;
                    typeLineIdx = (typeLineIdx + 1) % lines.length;
                    typeTimer = setTimeout(tickTypewriter, 380);
                    return;
                }
                typeTimer = setTimeout(tickTypewriter, 28);
            }
        }

        /**
         * 5. APPLY PROFILE TO DOM
         */
        function formatViewsCount(num) {
            const safeNum = Math.max(0, Number(num) || 0);
            if (safeNum >= 1000) {
                const kVal = safeNum / 1000;
                const formatted = Number.isInteger(kVal) ? kVal.toString() : kVal.toFixed(1).replace(/\.0$/, "");
                return `${formatted}k`;
            }
            return safeNum.toLocaleString();
        }

                    return {
                        ...DEFAULT_CONFIG,
                        ...parsed,
                        badges: { ...DEFAULT_CONFIG.badges, ...(parsed.badges || {}) },
                        socials: { ...DEFAULT_CONFIG.socials, ...(parsed.socials || {}) }
                    };
                }
            } catch (e) {
                console.warn("Local storage unavailable:", e);
            }
            return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
        }

        function saveConfig() {
            try {
                localStorage.setItem("abdullah_bladerunner_v1", JSON.stringify(config));
            } catch (e) {
                console.warn("Unable to persist config:", e);
            }
        }

        function copyText(text, message) {
            const area = document.createElement("textarea");
            area.value = text;
            area.style.position = "fixed";
            area.style.opacity = "0";
            document.body.appendChild(area);
            area.select();
            try {
                document.execCommand("copy");
                showToast(message);
            } catch (e) {
                showToast("Unable to copy");
            }
            document.body.removeChild(area);
        }

            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.classList.remove("opacity-0", "translate-y-2");
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add("opacity-0", "translate-y-2");
            }, 2200);
        }

            container.innerHTML = "";
            Object.entries(BADGE_DEFS).forEach(([key, def]) => {
                const label = document.createElement("label");
                label.className = "flex items-center gap-2 px-2.5 py-2 rounded-xl bg-white/[0.04] border border-white/10 cursor-pointer hover:bg-white/[0.08] transition";
                label.innerHTML = `
                    <input type="checkbox" ${config.badges[key] ? "checked" : ""} class="accent-white">
                    <span class="text-white/85">${def.label}</span>
                `;
                label.querySelector("input").addEventListener("change", (e) => {
                    config.badges[key] = e.target.checked;
                    applyProfile();
                });
                container.appendChild(label);
            });
        }

        function exportStandaloneHTML() {
            const cloneDoc = document.documentElement.cloneNode(true);
            const drawer = cloneDoc.querySelector("#customizer-drawer");
            if (drawer) drawer.classList.add("translate-x-full");
            const overlay = cloneDoc.querySelector("#enter-overlay");
            if (overlay) overlay.classList.remove("hidden-overlay");

            const exportConfig = { ...config };
            if (exportConfig.videoUrl.startsWith("blob:")) {
                exportConfig.videoUrl = "";
            }

            const htmlStr = "<!DOCTYPE html>\n" + cloneDoc.outerHTML.replace(
                /const DEFAULT_CONFIG = \{[\s\S]*?\};/,
                `const DEFAULT_CONFIG = ${JSON.stringify(exportConfig, null, 4)};`
            );

            const blob = new Blob([htmlStr], { type: "text/html" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `${(config.username || "abdullah").toLowerCase().replace(/[^a-z0-9]/g, "")}-profile.html`;
            a.click();
            URL.revokeObjectURL(a.href);
            showToast("Exported standalone HTML!");
        }

        /**
         * 7. INITIALIZATION ON WINDOW LOAD
         */
        window.onload = function () {
            resizeCanvases();
            window.addEventListener("resize", resizeCanvases);

            // Increment view counter by +1 every time someone joins/loads
            const baseViews = Number(config.views) || 28000;
            config.views = baseViews < 28000 ? 28001 : baseViews + 1;
            saveConfig();

            applyProfile();
            syncDrawerInputs();
            renderCursorSparkles();
            renderBgScene();

            // Click-to-Enter Dismissal
            const overlay = document.getElementById("enter-overlay");
            const enterSite = () => {
                overlay.classList.add("hidden-overlay");
                const videoEl = document.getElementById("bg-video");
                if (videoEl.classList.contains("active")) {
                    videoEl.play().catch(() => {});
                }
                if (!sound.useCustomFile && config.videoUrl && config.videoUrl.trim()) {
                    // Use the attached video's sound track by default when present
                    sound.setCustomAudioSrc(config.videoUrl.trim(), "Nightcall x Blade Runner Video Audio");
                }
                sound.start();
                tickTypewriter();
            };

            overlay.addEventListener("click", enterSite);
            overlay.addEventListener("keydown", (e) => {
                if (e.key === "Enter" || e.key === " ") enterSite();
            });

            // Top-Left Audio Pill Controls
            document.getElementById("audio-toggle-btn").addEventListener("click", () => sound.toggleMute());
            document.getElementById("volume-slider").addEventListener("input", (e) => {
                sound.setVolume(parseInt(e.target.value, 10) / 100);
            });

            // Drawer Open/Close
            const drawer = document.getElementById("customizer-drawer");
            document.getElementById("open-customizer-btn").addEventListener("click", () => {
                syncDrawerInputs();
                drawer.classList.remove("translate-x-full");
            });
            document.getElementById("close-customizer-btn").addEventListener("click", () => {
                drawer.classList.add("translate-x-full");
            });

            // Live Input Bindings
            document.getElementById("input-username").addEventListener("input", (e) => {
                config.username = e.target.value || "Abdullah";
                applyProfile();
            });
            document.getElementById("input-uid").addEventListener("input", (e) => {
                config.uid = e.target.value || "1";
                applyProfile();
            });
            document.getElementById("input-bio").addEventListener("input", (e) => {
                const lines = e.target.value.split("\n").map(l => l.trim()).filter(Boolean);
                config.bioLines = lines.length ? lines : ["..."];
                typeLineIdx = 0;
                typeCharIdx = 0;
                isDeleting = false;
                tickTypewriter();
            });
            document.getElementById("input-bg-mode").addEventListener("change", (e) => {
                config.bgMode = e.target.value;
                initBgParticles();
            });
            document.getElementById("input-synth-preset").addEventListener("change", (e) => {
                config.synthPreset = e.target.value;
                if (!sound.useCustomFile) {
                    const preset = sound.presets[config.synthPreset] || sound.presets.nightcall;
                    document.getElementById("audio-source-label").textContent = `Active: ${preset.name}`;
                    sound.restartSynthLoop();
                }
            });
            document.querySelectorAll(".glow-preset-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    config.glowPreset = btn.getAttribute("data-glow-preset");
                    applyProfile();
                });
            });

            // Video Upload & URL
            document.getElementById("input-video-file").addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const blobUrl = URL.createObjectURL(file);
                config.videoUrl = blobUrl;
                document.getElementById("input-video-url").value = "";
                applyProfile();
                sound.setCustomAudioSrc(blobUrl, `${file.name} (Video Audio)`);
                showToast(`Loaded video & sound: ${file.name}`);
            });
            document.getElementById("input-video-url").addEventListener("input", (e) => {
                config.videoUrl = e.target.value.trim();
                applyProfile();
                if (config.videoUrl) {
                    sound.setCustomAudioSrc(config.videoUrl, "Video Audio Track");
                }
            });
            document.getElementById("clear-video-btn").addEventListener("click", () => {
                config.videoUrl = "";
                document.getElementById("input-video-url").value = "";
                document.getElementById("input-video-file").value = "";
                applyProfile();
                sound.resetToSynth();
                showToast("Background video cleared");
            });

            // Custom Audio Upload & Clear
            document.getElementById("input-audio-file").addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const blobUrl = URL.createObjectURL(file);
                sound.setCustomAudioSrc(blobUrl, file.name);
                showToast(`Loaded audio: ${file.name}`);
            });
            document.getElementById("clear-audio-btn").addEventListener("click", () => {
                document.getElementById("input-audio-file").value = "";
                sound.resetToSynth();
                showToast("Switched to built-in ambient synth");
            });

            // Sparkle Trail & Glow Intensity
            document.getElementById("input-cursor-trail").addEventListener("change", (e) => {
                config.cursorTrail = e.target.checked;
            });
            document.getElementById("input-glow").addEventListener("input", (e) => {
                config.glowStrength = parseInt(e.target.value, 10);
                document.getElementById("val-glow").textContent = `${config.glowStrength}%`;
                applyProfile();
            });

            // Socials
            document.getElementById("input-discord").addEventListener("input", (e) => {
                config.socials = { discord: e.target.value };
                applyProfile();
            });

            // Footer Actions
            document.getElementById("save-btn").addEventListener("click", () => {
                saveConfig();
                showToast("Profile saved!");
            });
            document.getElementById("export-btn").addEventListener("click", exportStandaloneHTML);
            document.getElementById("reset-btn").addEventListener("click", () => {
                localStorage.removeItem("abdullah_bladerunner_v1");
                config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
                sound.resetToSynth();
                initBgParticles();
                applyProfile();
                syncDrawerInputs();
                showToast("Reset to default");
            });
        };
    </script>
</body>
</html>
