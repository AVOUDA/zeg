<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVOUDA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --glow-rgb: 255, 255, 255;
            --glow-strength: 1;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #bg-vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 35%, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.85) 100%),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.25) 50%, rgba(0, 0, 0, 0.8) 100%);
        }

        #cursor-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 60;
            pointer-events: none;
        }

        #enter-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #enter-overlay.hidden-overlay {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .click-me-text {
            font-weight: 700;
            font-size: clamp(1.35rem, 2.5vw, 1.75rem);
            color: #ffffff;
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.45);
            transition: transform 0.2s ease, text-shadow 0.2s ease;
        }

        #enter-overlay:hover .click-me-text {
            transform: scale(1.04);
            text-shadow: 0 0 26px rgba(255, 255, 255, 0.8);
        }

        .name-glow {
            text-shadow:
                0 0 calc(16px * var(--glow-strength)) rgba(var(--glow-rgb), 0.55),
                0 0 calc(34px * var(--glow-strength)) rgba(var(--glow-rgb), 0.22);
        }

        .social-icon-glow {
            filter: drop-shadow(0 0 calc(8px * var(--glow-strength)) rgba(var(--glow-rgb), 0.55));
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .social-icon-glow:hover {
            transform: translateY(-3px) scale(1.1);
            filter: drop-shadow(0 0 calc(14px * var(--glow-strength)) rgba(var(--glow-rgb), 0.95));
        }

        .hud-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
